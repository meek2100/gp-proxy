# File: pyproject.toml
[project]
name = "gp-proxy"
version = "0.1.0"
description = "Unofficial OpenConnect wrapper for GlobalProtect VPNs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["cryptography>=44.0.0"]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.1",
    "basedpyright==1.40.2",
    "codespell==2.4.3",
    "yamllint==1.38.0",
    "shellcheck-py==0.11.0.1",
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "--strict-markers"

# --- Tool Configurations ---

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = []

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = ["backend", "tests"]
extraPaths = ["backend"]

[tool.codespell]
skip = "*.min.js,*.min.css,*.lock,package-lock.json"
